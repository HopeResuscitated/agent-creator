    change: "jcode-provider-openrouter stream.rs: at EOF with no [DONE], no finish_reason and no tool call handed out
             for this response -> Err(INCOMPLETE_STREAM_ERROR) instead of MessageEnd{stop_reason: None}. Every other EOF
             is unchanged (finish_reason present; [DONE] present; a tool call emitted). runtime openrouter_sse_stream.rs:
             that error is retried at most INCOMPLETE_STREAM_MAX_RETRIES = 2 times, independent of provider.max_retries,
             through the existing RetryRollback path (partial text cleared, marker '[connection interrupted, retrying
             response from the top]', same backoff). After 2: 'Failed after 2 incomplete-stream retries', run exits
