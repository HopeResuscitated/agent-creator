architecture: |
  evals/bench/suite.sh -> evals/run.ts (node pin + model-server pin gates, stages patched node/npm/relay, agent home, fingerprint)
    -> evals/tools/run-in-job.ps1 (Job Object, AppContainer, ACL grants, fixed env + PATH)
      -> jcode (contained) -> model-relay.mjs 127.0.0.1:<rand> -> named pipe (DACL: user + this run's AC SID, Low IL)
      -> ModelBroker (trusted side, one canonical 127.x upstream) -> meter.mjs 127.0.0.2:11439
      -> Ollama 127.0.0.1:11434 -> hermes-local-32k (CPU; measured decode 3.9-4.8 tok/s on AC at 8-11k-token prompts (2.4 on battery),
         first token up to 282 s on AC (a2val3 T13; 274 s in b6); 357 s was b5 on battery, historical)
  Monitors: watch.ps1 (watchdog) + tripclass.mjs (attribution), fpcmp.mjs (repo + ~/.jcode integrity), analyze/classify.mjs,
            keepawake.ps1 + sleepcheck.ps1 (power integrity, ev-<label>/power.txt), ollamaenv.mjs (server settings + restart)
  Classification: evals/outcome.ts (unit-tested). Offline tests: node --test "evals/test/*.test.mjs" + bash evals/test/lint.sh
  Control mode (--no-contain-unsafe): same config/env/tools, no AppContainer/ACL/broker.

invariants:            # must hold on every contained run
  FS-1:   "agent writes only sandbox + agent home"
  NET-1:  "no direct network; only the in-container relay is reachable"
  NET-2:  "broker dials exactly one canonical loopback upstream"
  ENV-1:  "agent env is a fixed allow-list; no inherited secrets"
  PROC-1: "process tree proven dead after every run"
  ACL-1:  "ACLs restored and container profile deleted on every exit path"
  INT-1:  "repo and ~/.jcode unchanged"
  DET-1:  "same inputs -> identical fingerprint from any shell"

status_contract:       # run-in-job.ps1 exit -> scoring
  0: "graded (CLEAN / ENV_RESTORE_FAILED)"
  3: "UNSAFE_PROCESS_TREE - not graded, counts as fail"
  4: "SETUP_FAILED - agent never started, excluded from score"
  5: "AGENT_STATUS_UNKNOWN - not graded, counts as fail"
  suite_sh_exit_6: "meter died during the run - the whole run is not evidence (reduced.sh stops)"
  suite_sh_exit_7: "machine slept during the run (System log) - the whole run is not evidence (reduced.sh stops)"
  suite_sh_exit_8: "run.ts failed or refused (e.g. a pin gate exit 2) - not evidence"
  suite_sh_exit_10: "repo fingerprint or ~/.jcode changed during the run - not evidence"
  suite_sh_exit_11: "the Ollama server restarted during the run (its start time changed) - not evidence"
  suite_sh_exit_130: "interrupted (Ctrl+C / TERM / HUP); meter, watch, keepawake stopped; ev-<label>/INTERRUPTED - not evidence"
  suite_sh_exit_1_2: "1 meter could not start or its port was already in use; 2 usage / unsafe label / METER_LISTEN or METER_UPSTREAM
                     not 127.x.x.x:<port> - nothing ran"
  suite_trip_review: "exit code unchanged (0), but a VIOLATION/UNATTRIBUTED TRIP writes ev-<label>/TRIP-NEEDS-REVIEW and the last line
                      reads SUITE-DONE (TRIP NEEDS REVIEW: ...) (9c9bf85); whether that should fail the suite is a human decision"
  outcome_classes: "run.ts (evals/outcome.ts), first match: SETUP_FAILED | UNSAFE_PROCESS_TREE | AGENT_STATUS_UNKNOWN (not graded) >
                    ENV_RESTORE_FAILED (not graded) > ENV_CONTAMINATED > TIMEOUT (grader verdict kept as graderPass, never PASS) >
                    PASS | FAIL. Timeout = the wrapper's own 'timedOut=' line; a jcode run whose wrapper exited 0 without that line is
                    AGENT_STATUS_UNKNOWN (8e7ec62; elapsed time is only a fallback for non-jcode agents).
                    results.json from before 326ba4e recorded pass=true for timed-out runs; documents already counted those
                    as TIMEOUT, and the files are not rewritten"

