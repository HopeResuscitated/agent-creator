    semantics_per_response: "'no tool has run' is evaluated per model response, not per run. Reason: every truncated
             stream in R-C/R-D (T13 included) came 11-15 messages into the conversation, after earlier tools had run, so
             a run-wide rule would never fire on the real failure. Safe because jcode dispatches tools only after the
             stream ends, so a response that emitted no tool call has executed nothing; and the retried request is
