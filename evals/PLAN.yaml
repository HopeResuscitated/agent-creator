    findings:
      http_500: "retried: text-classified as retryable, provider.max_retries (default 8 incl. first try), backoff 1 s x2^n
                 +-20%, capped by retry_backoff_cap_secs (30). Exhausted -> run exits non-zero."
      eof_no_finish: "NOT an error: openrouter stream.rs emits MessageEnd{stop_reason: None} and returns Ok on EOF; no retry;
                      'incomplete' continuation skipped (no stop reason); partial prose becomes final_text; run exits 0.
                      This is the T13 / T05 failure mode."
      retry_rollback: "'[connection interrupted, retrying response from the top]' fires only for mid-stream transport errors
                       (error from the body stream / idle timeout), not for 500-before-output or clean EOF."
      knobs: "[provider] max_retries / JCODE_MAX_RETRIES, retry_backoff_cap_secs, stream_idle_timeout_secs; none makes clean EOF an error"
